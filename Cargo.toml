[package]
name = "frost-d77"
version = "0.1.0"
edition = "2024"
description = "An Iced desktop shell for Wayland"
license = "MIT"

[[bin]]
name = "frost"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "tokio", "fira-sans", "advanced-shaping", "lazy", "image-without-codecs", "svg"] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
iced_wayland_subscriber = { version = "=0.21.4", features = ["workspace"] }
iced_runtime = "=0.14.0"
iced_tiny_skia = "=0.14.1"
libc = "0.2"
pam-client2 = { version = "0.5.5", default-features = false }
smithay-client-toolkit = "=0.20.0"
wayland-client = "0.31"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }

[profile.dev]
debug = 0
